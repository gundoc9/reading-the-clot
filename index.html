<style>
:root{
  --cream:#EFE9DC; --paper:#FBF9F4; --ink:#221E19; --muted:#5B5349; --rule:#D8D0C0; --rule2:#E6DFD0;
  --accent:#7A1F3D; --extem:#2B4C7E; --intem:#2F5A3F; --fibtem:#7F4A0C; --faint:#B9B2A4; --shade:#DDE4EE;
  --serif:'Lora',Georgia,'Times New Roman',serif; --sans:'Poppins','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:440px;margin:0 auto;padding:0 18px 48px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{display:none} .screen.on{display:block}
/* landing */
.tabrow{display:flex;gap:18px;padding:14px 0 0;border-bottom:1px solid var(--rule)}
.tab{font-family:var(--sans);font-size:13px;color:var(--muted);min-height:44px;padding:0 2px;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.top .tab{color:var(--accent)}
.mast{padding:30px 0 8px}
.mark{display:block;width:120px;height:56px;margin:0 0 14px -2px}
h1{font-size:40px;line-height:1.05;font-weight:500;margin:0;letter-spacing:-0.01em}
.lede{font-size:17px;margin:14px 0 0;max-width:34ch}
.ver{font-family:var(--sans);font-size:11px;color:var(--muted);margin:10px 0 0}
.scope{margin:26px 0 8px;padding:14px 0 0;border-top:1px solid var(--rule);font-size:13.5px;color:var(--muted);line-height:1.5}
.scope p{margin:0 0 6px}
.sec{margin-top:30px}
.sec h2{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--accent);margin:0 0 4px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.row{display:block;width:100%;text-align:left;padding:12px 0 12px;border-bottom:1px solid var(--rule)}
.row .t{font-size:19px;line-height:1.25;font-weight:500}
.row .r{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.5}

<script>
/* Reading the clot - engine. Pure, no DOM. Same file runs in the app and under node.
   Firmness A(t) in mm from CT, CFT, MCF (single saturating exponential, S3/S4 definitions:
   A(CT) = 2 mm, A(CT+CFT) = 20 mm). FIBTEM uses a two-term shape fitted to S2 T1 FIBTEM.
   Alpha printed with the 2 mm tangent (S3) at plot scale K_ALPHA s/mm, fitted over the held rows.
   Lysis multiplies the plateau by (1 - L(t)/100), L rising smoothly to ML at 60 min, or sooner when a published
   LI30 (the ROTEM lysis index: width 30 min after CT as a share of MCF) says the fall was faster.
   A5, A10 and A20 are read 5, 10 and 20 min after CT (the ROTEM definition), never from the start of the test. */
var ENGINE = (function () {
  var ln = Math.log, exp = Math.exp;
  var CONST = /*__CONST__*/{"K_ALPHA": 11.4, "FIB": {"w": 0.58, "tau1": 30, "tau2": 500}}/*__/CONST__*/;

  // Single curve: A(t) = MCF (1 - exp(-((t - t0)/tau)^k)). With k = 1 this is the original saturating exponential.
  // When a published A10 is supplied, k is fitted so the curve passes through A(CT) = 2, A(CT+CFT) = 20 and A(600) = A10:
  // a slow tail (k < 1) reproduces the hypocoagulable rows whose A10 sits well below the exponential's.
  function paramsForK(p, k) {
    var a = Math.pow(-ln(1 - 2 / p.MCF), 1 / k), b = Math.pow(-ln(1 - 20 / p.MCF), 1 / k);
    var tau = p.CFT / (b - a);
    return { tau: tau, t0: p.CT - tau * a, k: k };
  }
  // Amplitude-anchored fit (rows flagged fit: 'amplitude'): the curve passes through A(CT) = 2, A(600) = A10 and,
  // when given, A(300) = A5; the clot formation time then follows from the curve instead of the published median,
  // because a population's separate medians of CT, CFT, A5, A10 and MCF do not lie on one curve.
  function amplitudeFit(p) {
    function tauFor(k) { var a = Math.pow(-ln(1 - 2 / p.MCF), 1 / k), lo = 1, hi = 20000, tau, t0, v;
      for (var i = 0; i < 80; i++) { tau = (lo + hi) / 2; t0 = p.CT - tau * a; v = p.MCF * (1 - exp(-Math.pow((p.CT + 600 - t0) / tau, k))); if (v > p.A10) lo = tau; else hi = tau; }
      return { tau: tau, t0: p.CT - tau * a, k: k }; }
    var q;
    if (p.A5 === undefined) q = tauFor(1);
    else { var lo = 0.3, hi = 3, k;
      for (var i = 0; i < 60; i++) { k = (lo + hi) / 2; q = tauFor(k); var v5 = p.MCF * (1 - exp(-Math.pow((p.CT + 300 - q.t0) / q.tau, k))); if (v5 < p.A5) hi = k; else lo = k; }
      q = tauFor(k); }
    return q;
  }
  function singleParams(p) {                 // p: {CT, CFT, MCF, A10?, A5?, fit?}
    if (p.fit === 'amplitude' && p.A10 !== undefined && p.A10 > 2 && p.A10 < p.MCF) return amplitudeFit(p);
    if (p.A10 === undefined || p.MCF <= 20 || p.A10 <= 20 || p.A10 >= p.MCF) return paramsForK(p, 1);
    var lo = 0.3, hi = 3, k = 1, q;
    for (var i = 0; i < 60; i++) {
      k = (lo + hi) / 2; q = paramsForK(p, k);
      var v = p.CT + 600 <= q.t0 ? 0 : p.MCF * (1 - exp(-Math.pow((p.CT + 600 - q.t0) / q.tau, k)));
      if (v < p.A10) lo = k; else hi = k;
    }
    return paramsForK(p, k);
  }
  function fibShape(p) {                     // p: {CT, MCF}; solves t0 so that A(CT) = 2
    var f = CONST.FIB, lo = p.CT - 3600, hi = p.CT, t0 = p.CT - 20;
    if (p.MCF <= 2) return { t0: p.CT, w: f.w, tau1: f.tau1, tau2: f.tau2 };   // under 2 mm there is no clotting time: the shape begins at the CT given
    for (var i = 0; i < 60; i++) {
      t0 = (lo + hi) / 2;
      var v = p.MCF * (f.w * (1 - exp(-(p.CT - t0) / f.tau1)) + (1 - f.w) * (1 - exp(-(p.CT - t0) / f.tau2)));
      if (v > 2) lo = t0; else hi = t0;   // v falls as t0 moves later
    }
    return { t0: t0, w: f.w, tau1: f.tau1, tau2: f.tau2 };
  }
  // raw firmness (no lysis)
  function firmnessRaw(t, p) {
    if (p.kind === 'fib') {
      var s = fibShape(p);
      if (t <= s.t0) return 0;
      return p.MCF * (s.w * (1 - exp(-(t - s.t0) / s.tau1)) + (1 - s.w) * (1 - exp(-(t - s.t0) / s.tau2)));
    }
    var q = singleParams(p);
    if (t <= q.t0) return 0;
    return p.MCF * (1 - exp(-Math.pow((t - q.t0) / q.tau, q.k)));
  }
  // slope in mm/s at time t
  function slopeRaw(t, p) {
    if (p.kind === 'fib') {
      var s = fibShape(p);
      if (t <= s.t0) return 0;
      return p.MCF * (s.w / s.tau1 * exp(-(t - s.t0) / s.tau1) + (1 - s.w) / s.tau2 * exp(-(t - s.t0) / s.tau2));
    }
    var q = singleParams(p);
    if (t <= q.t0) return 0;
    var u = (t - q.t0) / q.tau;
    return p.MCF * q.k * Math.pow(u, q.k - 1) / q.tau * exp(-Math.pow(u, q.k));
  }
  function smoothstep(x) { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
  // time at which the raw curve reaches frac of MCF (bisection on a monotone curve)
  function timeToFraction(p, frac) {
    var lo = 0, hi = 7200, m;
    for (var i = 0; i < 50; i++) { m = (lo + hi) / 2; if (firmnessRaw(m, p) < frac * p.MCF) lo = m; else hi = m; }
    return m;
  }
  function lysisEnd(p, tL) {                 // 60 min, or earlier so that the width at CT + 30 min is the published LI30 share of the maximum
    if (p.LI30 === undefined || p.LI30 >= 100) return 3600;
    var t30 = p.CT + 1800, need = (1 - p.LI30 / 100) / (p.ML / 100);   // the share of ML already lost at the LI30 clock
    if (t30 <= tL || need <= 0) return 3600;
    if (need >= 1) return t30;
    var lo = 0, hi = 1, x;
    for (var i = 0; i < 50; i++) { x = (lo + hi) / 2; if (smoothstep(x) < need) lo = x; else hi = x; }
    return Math.min(3600, tL + (t30 - tL) / x);   // the fall never runs past 60 min: ML is reached there whatever the index says
  }
  function lysisFactor(t, p) {
    var ML = p.ML || 0;
    if (ML <= 0) return 1;
    var tL = timeToFraction(p, 0.995), tEnd = lysisEnd(p, tL);
    if (t <= tL) return 1;
    return 1 - ML / 100 * smoothstep((t - tL) / (tEnd - tL));
  }
  function firmness(t, p) { return firmnessRaw(t, p) * lysisFactor(t, p); }
  function alpha(p) {                        // degrees, 2 mm tangent at plot scale K_ALPHA
    var t2 = p.CT;                             // A(CT) = 2 by construction (both models)
    return Math.atan(CONST.K_ALPHA * slopeRaw(t2, p)) * 180 / Math.PI;
  }
  function amplitudeAt(minutes, p) { return firmness(minutes * 60, p); }
  function maxLysis(p) {                     // largest drop from the displayed maximum within 60 min, %
    var peak = 0, i, v, minAfter = 1e9;
    for (i = 0; i <= 3600; i += 10) { v = firmness(i, p); if (v > peak) peak = v; }
    var tL2 = timeToFraction(p, 0.995);
    for (i = 0; i <= 3600; i += 10) { v = firmness(i, p); if (v < minAfter && i >= tL2) minAfter = v; }
    return peak > 0 ? (peak - minAfter) / peak * 100 : 0;
  }
  function ly30(p) {                         // % reduction 30 min after the maximum (TEG definition)
    var tMax = timeToFraction(p, 0.995), peak = firmness(tMax, p);
    return peak > 0 ? Math.max(0, (peak - firmness(tMax + 1800, p)) / peak * 100) : 0;
  }
  function li30(p) {                         // ROTEM lysis index: the width 30 min after CT as a percentage of the maximum (100 = no lysis)
    var peak = 0; for (var i = 0; i <= 3600; i += 10) peak = Math.max(peak, firmness(i, p));
    return peak > 0 ? Math.min(100, firmness(p.CT + 1800, p) / peak * 100) : 100;
  }
  function trace(p, seconds, step) {         // array of [t, A] over the window
    var out = [], t;
    for (t = 0; t <= seconds; t += (step || 5)) out.push([t, firmness(t, p)]);
    return out;
  }
  // scale a fibrin shape so a chosen early amplitude lands on a threshold (obstetric and platelet cards)
  function fibForA5(a5, CT) {
    var lo = 1, hi = 80, m, p;
    for (var i = 0; i < 50; i++) { m = (lo + hi) / 2; p = { kind: 'fib', CT: CT, MCF: m }; if (firmnessRaw(CT + 300, p) < a5) lo = m; else hi = m; }
    return p;
  }
  function singleForA5(a5, CT, CFT) {
    var lo = 21, hi = 90, m, p;
    for (var i = 0; i < 50; i++) { m = (lo + hi) / 2; p = { CT: CT, CFT: CFT, MCF: m }; if (firmnessRaw(CT + 300, p) < a5) lo = m; else hi = m; }
    return p;
  }
  function derivedCFT(p) { var lo = p.CT, hi = 7200, m; for (var i = 0; i < 60; i++) { m = (lo + hi) / 2; if (firmnessRaw(m, p) < 20) lo = m; else hi = m; } return m - p.CT; }
  return { CONST: CONST, singleParams: singleParams, derivedCFT: derivedCFT, fibShape: fibShape, firmnessRaw: firmnessRaw, slopeRaw: slopeRaw,
           firmness: firmness, alpha: alpha, amplitudeAt: amplitudeAt, maxLysis: maxLysis, ly30: ly30, li30: li30,
           trace: trace, timeToFraction: timeToFraction, fibForA5: fibForA5, singleForA5: singleForA5 };
})();
if (typeof module !== 'undefined') module.exports = ENGINE;

</script>

entry":"The instrument holds a cup of whole blood with a pin in it, and one of the two turns through a small arc. Fibrin bridging the gap resists the movement, and that resistance is drawn as amplitude against time, mirrored about a centre line.\n\nIn the TEG the cup turns and the pin senses the drag. In the ROTEM the pin turns on a spring and an optical system reads it. The TEG 6s turns nothing and reads a resonance.","analogy":"Stirring a pan of custard tells you through the spoon when it begins to set, and the pin here plays the spoon.","sources":["S2","S3","S4","S5","S28"],"related":["The five numbers on the trace","Two names for one curve"],"figure":{"window":3600,"ymax":80,"scrub":true},"knob":{"type":"chips","states":[{"label":"TEG cup","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM median in labour","p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":7},"basis":["S2.T2.T1.EXTEM"]}],"inset":"cup","marks":["CT","MCF"],"note":"360 µl of whole blood in a cup that turns through 4°45′ each way; the pin senses the resistance (Srivastava 2013, Curry 2018 BSH Fig 1). Trace: EXTEM median in labour (de Lange 2014).","readouts":["CT","MCF"]},{"label":"ROTEM pin","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM median in labour","p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":7},"basis":["S2.T2.T1.EXTEM"]}],"inset":"pin","marks":["CT","MCF"],"note":"300 µl in a fixed cup; the pin turns 4.75° on a spring and an optical system reads it (Srivastava 2013; Wells 2022 corrigendum Fig 1; Curry 2018 BSH Fig 1 prints 4°75′, read here as 4.75°).","readouts":["CT","MCF"]},{"label":"TEG 6s","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM median in labour","p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":7},"basis":["S2.T2.T1.EXTEM"]}],"inset":"resonance","marks":["CT","MCF"],"note":"Nothing turns: the sample is vibrated at 20 to 500 Hz and the resonance of its surface is read by an LED (Wells 2022, Curry 2018 BSH Fig 4). Its cartridge runs a heparinase channel that neutralises up to 5 IU/ml of heparin (Adelmann 2026).","readouts":["CT","MCF"]}]},"n":2},{"id":"names","section":0,"title":"Two names for one curve","twin":null,"param":null,"row":"ROTEM and TEG words for the same four points","entry":"ROTEM and TEG draw the same curve and name its points differently, and the assays differ as well: the ROTEM tissue factor test is EXTEM and the TEG kaolin test is CK, and each has a fibrinogen assay with the platelets blocked.\n\nTEG calls the four points R time, K time, maximum amplitude and LY30. The numbers behind the names come from different reagents, cups and volumes, and the BSH guideline warns that the two devices are not interchangeable.","analogy":"Fahrenheit and Celsius both put a number on the same warmth, and a cook who memorised 180 gets a very different oven on the other scale.","sources":["S3","S4","S5","S15"],"related":["The five numbers on the trace","Normal for whom"],"figure":{"window":3600,"ymax":80},"knob":{"type":"chips","states":[{"label":"ROTEM names","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM in labour","p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":7},"basis":["S2.T2.T1.EXTEM"]}],"marks":["CT","CFT","MCF","ML"],"note":"Vocabulary: CT, CFT, MCF, ML. Trace: EXTEM median in labour (de Lange 2014)."},{"label":"TEG names","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM in labour","teg":true,"p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":7},"basis":["S2.T2.T1.EXTEM"]}],"marks":["CT","CFT","MCF","ML"],"note":"Vocabulary: R, K, MA, LY30. Same trace; the numbers on a TEG would differ (Curry 2018 BSH practice point, Venema 2010)."}]},"n":3},{"id":"assays","section":0,"title":"Which test: EXTEM, INTEM, FIBTEM","twin":null,"param":null,"row":"what each cup adds to the same blood, and the TEG twins","entry":"Each cup takes the same blood and a different reagent. EXTEM starts the clot with tissue factor, the extrinsic pathway, and is the screening test. INTEM uses a contact activator, ellagic acid with phospholipid, so it waits far longer and feels heparin. FIBTEM is EXTEM with the platelets blocked by cytochalasin D, leaving the fibrin clot on its own.\n\nThe gap between EXTEM and FIBTEM is the platelets. HEPTEM is INTEM with heparinase, APTEM is EXTEM with aprotinin.","analogy":"Baking the same batter once with the eggs left out shows what the eggs were doing, and FIBTEM leaves the platelets out for the same reason.","sources":["S3","S4","S27"],"related":["Two names for one curve","Low fibrinogen","Heparin","Hyperfibrinolysis"],"figure":{"window":1800,"ymax":80},"defs":[["EXTEM","tissue factor","the extrinsic pathway; the screening test. RapidTEG adds kaolin as well and is not read for the R time"],["INTEM","kaolin","contact activation by ellagic acid with phospholipid: the long wait, and sensitive to heparin"],["HEPTEM","kaolin + heparinase","INTEM with heparinase added: the clot underneath the heparin"],["FIBTEM","functional fibrinogen","EXTEM with the platelets blocked by cytochalasin D; the TEG cup blocks them with a GPIIb/IIIa antagonist"],["APTEM","not listed","EXTEM with aprotinin added: a fall that APTEM removes was fibrinolysis"]],"defswrap":true,"knob":{"type":"chips","states":[{"label":"the same blood","series":[{"hue":"EXTEM","claim":"S27.T2.normal.EXTEM","label":"EXTEM","teach":true,"p":{"CT":63,"MCF":60.4,"CFT":87,"A10":54.1,"ML":3,"LI30":100},"basis":["S27.T2.normal.EXTEM"]},{"hue":"INTEM","claim":"S27.T2.normal.INTEM","label":"INTEM","p":{"CT":160,"MCF":61.2,"CFT":63,"A10":56.3,"ML":4,"LI30":99},"basis":["S27.T2.normal.INTEM"]},{"hue":"FIBTEM","claim":"S27.T2.normal.FIBTEM","label":"FIBTEM","p":{"CT":66,"MCF":12.4,"kind":"fib","ML":0,"LI30":100},"basis":["S27.T2.normal.FIBTEM"]}],"compare":["CT","CFT","A10","MCF"],"marks":["CTall","MCFall"],"note":"Blood from 11 healthy adults run in three cups (Larsen 2011, Table 2): EXTEM clots at 63 s and INTEM at 160 s, and both reach 60 mm; FIBTEM, the same blood with its platelets blocked, reaches 12 mm."},{"label":"EXTEM","series":[{"hue":"EXTEM","claim":"S27.T2.normal.EXTEM","label":"EXTEM","teach":true,"p":{"CT":63,"MCF":60.4,"CFT":87,"A10":54.1,"ML":3,"LI30":100},"basis":["S27.T2.normal.EXTEM"]},{"hue":"INTEM","claim":"S27.T2.normal.INTEM","label":"INTEM","faint":true,"p":{"CT":160,"MCF":61.2,"CFT":63,"A10":56.3,"ML":4,"LI30":99},"basis":["S27.T2.normal.INTEM"]},{"hue":"FIBTEM","claim":"S27.T2.normal.FIBTEM","label":"FIBTEM","faint":true,"p":{"CT":66,"MCF":12.4,"kind":"fib","ML":0,"LI30":100},"basis":["S27.T2.normal.FIBTEM"]}],"marks":["CT","CFT","MCF"],"note":"Tissue factor starts the clot through the extrinsic pathway, so EXTEM is quick, 63 s here, and it is the screening test for the clotting time and the firmness (Wells 2022, Table 2). The TEG twin uses tissue factor as well; the RapidTEG adds kaolin for a faster maximum amplitude and its R time is not read (Wells 2022).","readouts":["CT","CFT","A10","MCF"]},{"label":"INTEM","series":[{"hue":"INTEM","claim":"S27.T2.normal.INTEM","label":"INTEM","teach":true,"p":{"CT":160,"MCF":61.2,"CFT":63,"A10":56.3,"ML":4,"LI30":99},"basis":["S27.T2.normal.INTEM"]},{"hue":"EXTEM","claim":"S27.T2.normal.EXTEM","label":"EXTEM","faint":true,"p":{"CT":63,"MCF":60.4,"CFT":87,"A10":54.1,"ML":3,"LI30":100},"basis":["S27.T2.normal.EXTEM"]},{"hue":"FIBTEM","claim":"S27.T2.normal.FIBTEM","label":"FIBTEM","faint":true,"p":{"CT":66,"MCF":12.4,"kind":"fib","ML":0,"LI30":100},"basis":["S27.T2.normal.FIBTEM"]}],"marks":["CT","CFT","MCF"],"note":"Ellagic acid with phospholipid activates the contact pathway, so INTEM waits 160 s here against EXTEM's 63 and reaches the same 60 mm (Larsen 2011). The contact pathway is sensitive to heparin at 0.005 IU/ml, and the TEG kaolin cup is its twin (Srivastava 2013; Wells 2022, Table 2).","readouts":["CT","CFT","A10","MCF"]},{"label":"FIBTEM","series":[{"hue":"FIBTEM","claim":"S27.T2.normal.FIBTEM","label":"FIBTEM","teach":true,"p":{"CT":66,"MCF":12.4,"kind":"fib","M CF range"}],"note":"Between 6 and 10 cm dilatation or before planned Caesarean section; fibrinogen 4.9 g/L, platelets 214. Within an hour of delivery the values had barely moved (de Lange 2014 Tables 2 and 3).","readouts":["CT","A10","MCF","FIBMCF"]},{"label":"TEG kaolin","series":[{"hue":"EXTEM","label":"kaolin TEG, range midpoints","ilu":true,"ct":"S1.T3.adult.EXTEM","ctval":360,"cftval":150,"mcf":64,"teg":true,"p":{"CT":360,"MCF":64,"CFT":150,"A10":53},"basis":["base S1.T3.adult.EXTEM","CT 360 ILLUSTRATIVE","MCF 64 ILLUSTRATIVE","CFT 150 ILLUSTRATIVE"]}],"marks":["CT","CFT","MCF"],"brackets":[{"axis":"t","param":"CT","claim":"S28.F2.TEG6s.citrated","label":"R, TEG 6s"},{"axis":"a","param":"MCF","claim":"S28.F2.TEG6s.citrated","label":"MA, TEG 6s"}],"note":"ILLUSTRATIVE: drawn at the midpoints of the classic device's adult kaolin ranges, R 4 to 8 min, K 1 to 4 min, MA 55 to 73 mm (Srivastava 2013). The brackets are the TEG 6s cartridge ranges, R 4.6 to 9.1 min and MA 52 to 69 mm (Adelmann 2026). No TEG median was read for this app, and TEG and ROTEM numbers are not interchangeable (Venema 2010, cited in Curry 2018).","readouts":["CT","CFT","MCF"]}]},"n":5},{"id":"low-fibrinogen","section":1,"title":"Low fibrinogen","twin":null,"param":null,"row":"the fibrin clot thins first; give fibrinogen","entry":"A low fibrinogen shows first in FIBTEM, the assay that removes the platelets. In donor blood diluted by half the FIBTEM clot fell from 12 to 2 mm, while EXTEM, with its platelets, kept 40 of its 60 mm.\n\nThe treatment is fibrinogen, as concentrate or cryoprecipitate. The obstetric guideline attaches it to a FIBTEM A5 below 7 mm, or below 12 mm with ongoing bleeding, and the cardiac trial to a FIBTEM A10 of 8 mm or less.","analogy":"Concrete with too little cement crumbles however much gravel is in the mix, and gravel is not the fix.","sources":["S2","S4","S5","S9","S10","S19","S24","S25","S26","S27"],"related":["Low platelets","The obstetric threshold"],"figure":{"window":1800,"ymax":80},"intervention":{"give":"Fibrinogen concentrate or cryoprecipitate","when":"FIBTEM A5 under 7 mm, or under 12 mm with ongoing bleeding (Curry 2018 BSH, grade 2C). Above 12 mm replacement is unlikely to help (grade 2B), and OBS2 found no benefit from fibrinogen given at 15 mm or less (Collins 2017 OBS2, 55 women).","adults":"Cardiac surgery, the multicentre trial: FIBTEM A10 8 mm or less, cryoprecipitate 10 units or fibrinogen concentrate 4 g (Karkouti 2016, 12 hospitals, 7,402 patients). Frankfurt: EXTEM A10 40 mm or less with FIBTEM A10 10 mm or less, fibrinogen 25 to 50 mg/kg, the tested arm of a single-centre trial of 100 (Weber 2012). Essen used the same triggers with a target FIBTEM A10 above 15 mm, and its rule that 25 mg/kg raises the FIBTEM A10 by about 4 mm, 50 by 8 and 75 by 12 is a practice rule from 2006, not a result of the cohort (Görlinger 2011, before-and-after, 3,865 patients). Postpartum: FIBTEM A5 under 7 mm with EXTEM A5 under 47, fibrinogen concentrate 3 g; 7 to 12 mm, 3 g only with active bleeding (Mallaiah 2015, before-and-after, 93 women).","also":"In liver transplantation a FIBTEM A5 under 4 mm predicted a fibrinogen under 1 g/L, with 5 mm the A10 cut (Song 2014, 239 patients, retrospective); the 5 mm that Curry 2018 prints as an A5 is that A10 figure. On the rapid TEG, an angle under 63 degrees gave a ten-pack of cryoprecipitate in the Denver trial (Gonzalez 2016, one centre, 111 patients)."},"knob":{"type":"chips","states":[{"label":"FIBTEM at 7 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"normal, labour","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"low fibrinogen","fibA5":7,"teach":true,"p":{"kind":"fib","CT":39,"MCF":8.6},"basis":["threshold FIBTEM A5 7 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5"],"note":"Normal FIBTEM in labour (de Lange 2014, Table 2) beside the fibrin curve scaled to the 7 mm threshold (Curry 2018 BSH)."},{"label":"dilution, in vitro","series":[{"hue":"EXTEM","claim":"S27.T2.normal.EXTEM","label":"undiluted","faint":true,"p":{"CT":63,"MCF":60.4,"CFT":87,"A10":54.1,"ML":3,"LI30":100},"basis":["S27.T2.normal.EXTEM"]},{"hue":"EXTEM","claim":"S27.T2.dilution.EXTEM","label":"EXTEM, diluted by half","teach":true,"p":{"CT":147,"MCF":39.7,"CFT":276,"A10":31.1,"ML":9,"LI30":100},"basis":["S27.T2.dilution.EXTEM"]},{"hue":"FIBTEM","claim":"S27.T2.dilution.FIBTEM","label":"FIBTEM, diluted by half","p":{"CT":66,"MCF":1.9,"kind":"fib"},"basis":["S27.T2.dilution.FIBTEM"]}],"compare":["CT","CFT","A10","MCF"],"marks":["CT","A10","MCF"],"note":"In vitro model, healthy donors, n = 11 (Larsen 2011, Table 2): blood diluted by half with starch, fibrinogen about 1.5 g/L, platelets above 100. EXTEM keeps 40 of its 60 mm and the FIBTEM clot is 2 mm: its A10 and MCF are means across the eleven runs, and the fibrin curve is drawn from the untreated clotting time because a clot under 2 mm has none."},{"label":"liver, 4 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"normal, labour","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"fibrinogen under 1 g/L","fibA5":4,"teach":true,"p":{"kind":"fib","CT":39,"MCF":4.9},"basis":["threshold FIBTEM A5 4 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5"],"note":"The fibrin curve scaled to Song's 4 mm A5 cut for a fibrinogen under 1 g/L in liver transplantation (Song 2014), beside the labour median (de Lange 2014)."},{"label":"liver, the medians","series":[{"hue":"FIBTEM","claim":"S1.T4.adult.FIBTEM","label":"normal adult","faint":true,"p":{"CT":39,"MCF":16,"kind":"fib"},"basis":["S1.T4.adult.FIBTEM"]},{"hue":"FIBTEM","claim":"S10.T2.FIBTEM","label":"liver transplant medians","teach":true,"p":{"CT":39,"MCF":6,"kind":"fib"},"basis":["S10.T2.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","A10"],"note":"A published abnormal trace: the FIBTEM medians of 239 liver transplant recipients with a median fibrinogen of 1 g/L, A5 5, A10 5, MCF 6 mm (Song 2014, Table 2), beside the adult median (Lang 2005 via Oswald 2010)."}]},"n":6},{"id":"low-platelets","section":1,"title":"Low platelets","twin":null,"param":null,"row":"EXTEM shrinks and FIBTEM holds; give platelets","entry":"A low platelet count narrows EXTEM and leaves FIBTEM, which never had platelets in it, at its width; the clotting time holds. Donor blood taken to a count of 20 lost 24 mm of EXTEM firmness and 1 mm of FIBTEM.\n\nIn liver transplantation an EXTEM A5 of 19 mm and an A10 of 27 mm predicted a count under 50. The treatment is platelets when EXTEM is narrow and FIBTEM is normal; a narrow FIBTEM says fibrinogen first.","analogy":"If the slab is weak and the cement is fine, the gravel is what ran out.","sources":["S1","S4","S5","S10","S11","S13","S19","S24","S25","S26","S27"],"related":["Low fibrinogen","Platelet dysfunction, the trace cannot see it","Normal trace, bleeding patient"],"figure":{"window":1800,"ymax":80},"intervention":{"give":"Platelets","when":"EXTEM A5 under 19 mm, or A10 under 27 mm, with a normal FIBTEM: the liver-transplant cuts for a count under 50 (Song 2014, 239 patients, AUC 0.87); Wells 2022 prints 18 to 19 mm. In children after bypass, EXTEM A10 38 mm or less with FIBTEM A10 above 3 mm (Faraoni 2015).","adults":"Cardiac surgery, the multicentre trial: one platelet pool when the functioning platelet count is under 75 or EXTEM A10 is under 35 mm with FIBTEM A10 above 8 (Karkouti 2016, 12 hospitals, 7,402 patients). Frankfurt and Essen: EXTEM A10 40 mm or less with FIBTEM A10 above 10 (Weber 2012, the tested arm of a single-centre trial; Görlinger 2011, before-and-after cohort). Postpartum: a low EXTEM with a normal FIBTEM, or ten units of blood or more (Mallaiah 2015).","also":"The 27 mm that Curry 2018 prints as an A5 is Song's A10 cut. On the rapid TEG, an MA under 55 mm gave one apheresis platelet unit in the Denver trial (Gonzalez 2016, one centre, 111 patients). The platelet share of the clot is EXTEM minus FIBTEM, and Solomon 2015 shows the subtraction should use clot elasticity, because the same 30 mm gap in firmness stands for very different platelet counts."},"knob":{"type":"chips","states":[{"label":"EXTEM and FIBTEM","series":[{"hue":"EXTEM","label":"EXTEM, low platelets","extA10":27,"ct":"S1.T3.adult.EXTEM","p":{"CT":55,"CFT":95,"MCF":27},"basis":["threshold EXTEM A10 27 mm; CT and CFT from S1.T3.adult.EXTEM"]},{"hue":"FIBTEM","claim":"S1.T4.adult.FIBTEM","label":"FIBTEM, unchanged","p":{"CT":39,"MCF":16,"kind":"fib"},"basis":["S1.T4.adult.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","A10","gap"],"note":"EXTEM scaled so the A10 lands on Song's 27 mm cut for a platelet count under 50 (Song 2014), beside the adult FIBTEM median (Lang 2005 via Oswald 2010). The shaded gap is the platelet share."},{"label":"platelets 20, in vitro","series":[{"hue":"EXTEM","claim":"S27.T2.normal.EXTEM","label":"untreated","faint":true,"p":{"CT":63,"MCF":60.4,"CFT":87,"A10":54.1,"ML":3,"LI30":100},"basis":["S27.T2.normal.EXTEM"]},{"hue":"EXTEM","claim":"S27.T2.thrombocytopenia.EXTEM","label":"EXTEM, platelets 20","teach":true,"p":{"CT":55,"MCF":36.9,"CFT":329,"A10":28.1,"ML":7,"LI30":100},"basis":["S27.T2.thrombocytopenia.EXTEM"]},{"hue":"FIBTEM","claim":"S27.T2.thrombocytopenia.FIBTEM","label":"FIBTEM, platelets 20","p":{"CT":51,"MCF":11.2,"kind":"fib","ML":0,"LI30":100},"basis":["S27.T2.thrombocytopenia.FIBTEM"]}],"compare":["CT","CFT","A10","MCF"],"marks":["CT","A10","MCF"],"note":"In vitro model, healthy donors, n = 11 (Larsen 2011, Table 2): platelets taken to a mean of 20 by plasma exchange. EXTEM falls from 60 to 37 mm and FIBTEM from 12 to 11, with the clotting time unmoved: the picture that says give platelets."},{"label":"liver, the medians","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"normal adult","faint":true,"p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","claim":"S10.T2.EXTEM","label":"liver transplant medians","teach":true,"p":{"CT":71,"MCF":37,"CFT":328,"A10":27,"A5":19,"fit":"amplitude"},"basis":["S10.T2.EXTEM"]}],"compare":["CT","CFT","A5","A10","MCF"],"marks":["CT","A5","A10","MCF"],"note":"A published abnormal trace: the EXTEM medians of 239 liver transplant recipients with a median platelet count of 47 and fibrinogen of 1 g/L, CT 71 s, A5 19, A10 27, MCF 37 mm (Song 2014, Table 2). The curve is drawn through those four numbers, so its clot formation time comes out at 328 s where the table's median is 235 s: a clot of 19 mm five minutes after CT has not reached 20 mm at four minutes. The longer clotting time is the liver disease, the slow climb is the platelets and fibrinogen."}]},"n":7},{"id":"hyperfibrinolysis","section":1,"title":"Hyperfibrinolysis","twin":null,"param":null,"row":"the clot melts after the maximum; give tranexamic acid","entry":"A clot that forms and then dissolves shows as a trace that reaches its maximum and tails away. ROTEM calls a fall above 15% hyperfibrinolysis; TEG calls it at an LY30 above 7.5% or 8%, by source, and in trauma a TEG lysis of 3% already predicts transfusion.\n\nThe treatment is tranexamic acid. APTEM, which is EXTEM with aprotinin added, confirms the pattern when its trace holds while EXTEM falls, and a normal APTEM does not rule lysis out.","analogy":"A sandcastle that stands at high water and slumps as the tide turns needs a wall, and the wall is tranexamic acid.","sources":["S2","S3","S4","S5","S26","S27","S33"],"related":["Low fibrinogen","Normal trace, bleeding patient"],"figure":{"window":3600,"ymax":80},"intervention":{"give":"Tranexamic acid","when":"ROTEM maximum lysis above 15%, or TEG LY30 above 7.5% (Wells 2022) or 8% (Curry 2018, Table IV); in trauma a TEG lysis of 3% or more marks a patient at higher risk of needing blood components (Curry 2018 BSH, grade 2C).","also":"Aminocaproic acid is the alternative antifibrinolytic (Wells 2022, Table 1). An APTEM that holds its width while EXTEM falls confirms lysis (Wells 2022; de Lange 2014), and in trauma or postpartum bleeding tranexamic acid is not withheld on the trace (Curry 2018, grade 1B). The Denver rapid TEG protocol gave tranexamic acid at an LY30 of 7.5%, lowered to 3% in 2012 (Gonzalez 2016); Essen gave 2 g at a clot lysis index under 85% at 60 minutes (Görlinger 2011). In postpartum haemorrhage the plasmin-driven form, acute obstetric coagulopathy, breaks down circulating fibrinogen as well as the clot, and its breakdown products block new fibrin, so the fibrin-only trace is repeated after fibrinogen is given (Riddell 2026)."},"knob":{"type":"chips","states":[{"label":"against normal","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"normal EXTEM, labour","faint":true,"p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":7},"basis":["S2.T2.T1.EXTEM"]},{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM, lysing","mlval":41,"teach":true,"p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":41},"pub":false,"basis":["S2.T2.T1.EXTEM","ML 41 from S2 results (maximum observed)"]}],"compare":["MCF","ML","LY30"],"marks":["MCF","ML"],"note":"Normal EXTEM in labour (de Lange 2014) beside the same curve at ML 41%, the largest value seen in a healthy labouring woman (de Lange 2014)."},{"label":"APTEM confirms","series":[{"hue":"EXTEM","claim":"S2.T2.T1.EXTEM","label":"EXTEM, lysing","mlval":41,"p":{"CT":45,"MCF":71,"CFT":69,"A10":64,"ML":41},"pub":false,"basis":["S2.T2.T1.EXTEM","ML 41 from S2 results (maximum observed)"]},{"hue":"EXTEM","claim":"S2.T2.T1.APTEM","dash":true,"label":"APTEM","p":{"CT":43,"MCF":71,"CFT":69,"A10":64,"ML":4},"basis":["S2.T2.T1.APTEM"]}],"compare":["MCF","ML"],"marks":["MCF","ML"],"note":"EXTEM at ML 41% beside APTEM at its median in labour, ML 4% (de Lange 2014). The difference between the two is the lysis."},{"label":"tPA, in vitro","series":[{"hue":"EXTEM","claim":"S27.T2.lysis.EXTEM","label":"EXTEM, tPA","teach":true,"p":{"CT":59,"MCF":56.7,"CFT":85,"A10":54.3,"ML":100,"LI30":35},"basis":["S27.T2.lysis.EXTEM"]},{"hue":"EXTEM","claim":"S27.T2.lysis.APTEM","dash":true,"label":"APTEM, tPA","p":{"CT":60,"MCF":60.8,"CFT":89,"A10":54.4,"ML":12,"LI30":99},"basis":["S27.T2.lysis.APTEM"]}],"compare":["MCF","LI30","ML"],"marks":["MCF","ML"],"note":"In vitro model, healthy donors, n = 11 (Larsen 2011, Table 2): tPA added to the blood. EXTEM reaches 57 mm and is 35% of that 30 minutes after its clotting time, then melts away; APTEM holds 61 mm and loses 12%. The fall is drawn from the published LI30 and ML, and the diagnosis needed the 30 minute index, 31 minutes into the run."}]},"n":8},{"id":"factor-deficiency","section":1,"title":"Factor deficiency, the long clotting time","twin":null,"param":null,"row":"the wait for 2 mm stretches; give plasma or PCC","entry":"When clotting factors are short the trace stays flat for longer before the first 2 mm arrives, and once it starts the climb and the maximum can be normal, because fibrinogen and platelets are intact. A normal FIBTEM alongside says the fibrinogen is not the cause.\n\nThe treatment is fresh frozen plasma, or prothrombin complex concentrate where the guideline allows it. Heparin, warfarin and very low fibrinogen prolong the same wait, so the heparinase test and FIBTEM are read first.","analogy":"A car that turns over for a long time before it catches is short of spark, and the clotting factors are the spark.","sources":["S1","S4","S5","S13","S18","S19","S24","S25","S26"],"related":["Heparin","Anticoagulants the trace misses or catches","The child on bypass"],"figure":{"window":900,"ymax":80},"intervention":{"give":"Fresh frozen plasma, or prothrombin complex concentrate","when":"Children after bypass: EXTEM CT 111 s or more, FFP 15 ml/kg (Faraoni 2015, 150 children, retrospective, one centre's practice). Adult liver transplantation: EXTEM CT 80 s or more for PCC and INTEM CT 240 s or more for FFP (Kirchner 2014, retrospective, quoted through Curry 2018, not read). Postpartum: FFP when the EXTEM CT is above 100 s with active bleeding (Mallaiah 2015, before-and-after, 93 women). Rapid TEG in trauma: ACT above 110 s, two units of plasma (Gonzalez 2016, one centre, randomised).","adults":"Cardiac surgery, the multicentre trial: EXTEM CT over 90 s, four-factor PCC about 20 IU/kg or plasma 2 to 4 units, plasma preferred when FIBTEM is also low or the bleeding is massive (Karkouti 2016, 12 hospitals, 7,402 patients). Frankfurt: EXTEM CT over 80 s or HEPTEM CT over 240 s, PCC 20 to 30 IU/kg or FFP 15 ml/kg (Weber 2012, the tested arm of a single-centre trial of 100). Essen: EXTEM CT over 90 s, PCC 20 to 25 U/kg, or 35 to 40 with severe bleeding above 100 s (Görlinger 2011, before-and-after, 3,865 patients, in-hospital mortality unchanged).","also":"The guideline gives FFP first and PCC as an option, and does not recommend PCC in obstetric or trauma bleeding (Curry 2018, Table IV, ungraded)."},"knob":{"type":"chips","states":[{"label":"child after bypass","series":[{"hue":"EXTEM","claim":"S1.T3.y2-5.EXTEM","label":"normal, 2 to 5 years","faint":true,"p":{"CT":56,"MCF":61,"CFT":72,"A10":58},"basis":["S1.T3.y2-5.EXTEM"]},{"hue":"EXTEM","label":"EXTEM, CT 111 s","ct":"S1.T3.y2-5.EXTEM","ctthr":"Faraoni_EXTEM_CT","teach":true,"p":{"CT":111,"CFT":72,"MCF":61},"basis":["threshold CT 111 s (Faraoni_EXTEM_CT); CFT and MCF from S1.T3.y2-5.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT"],"note":"The clotting time moved to Faraoni's 111 s cut, the rest of the curve at the 2 to 5 year median (Oswald 2010). Faraoni 2015 prints the cut as 111 s or more; Curry 2018 prints it as above 111 s."},{"label":"adult cardiac, 90 s","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"normal adult","faint":true,"p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","label":"EXTEM, CT 90 s","ct":"S1.T3.adult.EXTEM","ctthr":"Karkouti_EXTEM_CT","teach":true,"p":{"CT":90,"CFT":95,"MCF":60},"basis":["threshold CT 90 s (Karkouti_EXTEM_CT); CFT and MCF from S1.T3.adult.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT"],"note":"EXTEM clotting time at 90 s, the trigger for PCC or plasma in the multicentre cardiac trial (Karkouti 2016), the rest of the curve at the adult median (Lang 2005 via Oswald 2010)."},{"label":"adult liver, EXTEM","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"normal adult","faint":true,"p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","label":"EXTEM, CT 80 s","ct":"S1.T3.adult.EXTEM","ctthr":"Kirchner_EXTEM_CT","teach":true,"p":{"CT":80,"CFT":95,"MCF":60},"basis":["threshold CT 80 s (Kirchner_EXTEM_CT); CFT and MCF from S1.T3.adult.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT"],"note":"EXTEM clotting time at 80 s, the PCC threshold in a liver transplant series (Kirchner 2014, cited in Curry 2018), the rest of the curve at the adult median (Lang 2005 via Oswald 2010)."},{"label":"adult liver, INTEM","series":[{"hue":"INTEM","claim":"S1.T3.adult.INTEM","label":"normal adult","faint":true,"p":{"CT":184,"MCF":61,"CFT":63,"A10":55},"basis":["S1.T3.adult.INTEM"]},{"hue":"INTEM","label":"INTEM, CT 240 s","ct":"S1.T3.adult.INTEM","ctthr":"Kirchner_INTEM_CT","teach":true,"p":{"CT":240,"CFT":63,"MCF":61},"basis":["threshold CT 240 s (Kirchner_INTEM_CT); CFT and MCF from S1.T3.adult.INTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT"],"note":"INTEM clotting time at 240 s, the FFP threshold in the same series (Kirchner 2014, cited in Curry 2018), beside the adult INTEM median of 184 s (Lang 2005 via Oswald 2010)."}]},"n":9},{"id":"heparin","section":1,"title":"Heparin","twin":null,"param":null,"row":"INTEM waits longer than HEPTEM; give protamine","entry":"INTEM's normal wait is long, 184 s in adults against 55 s for EXTEM, because its contact activator is slow. Heparin stretches it further, and the contact pathway is sensitive to heparin at 0.005 IU per ml, so after bypass or at graft reperfusion a long INTEM wait may be heparin alone. HEPTEM runs the same test with heparinase added.\n\nIf HEPTEM comes back to normal the gap between the two was heparin, and the treatment is protamine, not plasma.","analogy":"Muting one instrument in a recording shows whether it was the one making the noise, and heparinase mutes the heparin.","sources":["S1","S3","S4","S5","S13","S17","S24","S26","S27","S28"],"related":["Factor deficiency, the long clotting time","The child on bypass"],"figure":{"window":1200,"ymax":80},"intervention":{"give":"Protamine","when":"After bypass in children, a HEPTEM clotting time below 0.8 of the INTEM clotting time: protamine 0.5 mg/kg (Nakayama 2015, randomised, 100 children). The same 0.8 ratio on the heparinase ACT: protamine at a quarter of the heparin dose (Faraoni 2015).","adults":"Frankfurt: INTEM CT over 240 s with the HEPTEM to INTEM ratio under 0.8 and an ACT over 130 s, protamine 30 IU/kg (Weber 2012, the tested arm of a single-centre trial). Essen: INTEM CT over 240 s with HEPTEM at least 20% shorter, repeat protamine (Görlinger 2011, before-and-after, 3,865 patients).","also":"Heparinase tests are recommended at graft reperfusion, where a heparin-like effect is common (Curry 2018, grade 2B). On the TEG the kaolin cup against the kaolin cup with heparinase is the same comparison, and the heparinase neutralises up to 5 IU/ml: after bypass heparin the rapid TEG maximum amplitude could be read in 56% of samples without it and 95% with it (Adelmann 2026, 185 patients, 7 centres)."},"knob":{"type":"chips","states":[{"label":"no heparin","series":[{"hue":"INTEM","claim":"S1.T3.adult.INTEM","label":"INTEM","p":{"CT":184,"MCF":61,"CFT":63,"A10":55},"basis":["S1.T3.adult.INTEM"]},{"hue":"INTEM","claim":"S1.T3.adult.INTEM","dash":true,"label":"HEPTEM","p":{"CT":184,"MCF":61,"CFT":63,"A10":55},"basis":["S1.T3.adult.INTEM"]}],"compare":["CT","MCF"],"marks":["CT"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.INTEM","label":"INTEM CT range"}],"note":"This is a normal INTEM, not a delayed one: its clotting time of 184 s (137 to 246 s in adults) is about three times EXTEM's, because the contact activator is slow. Without heparin INTEM and HEPTEM lie on top of each other, which is the point (Oswald 2010 from Lang 2005)."},{"label":"at the protamine trigger","series":[{"hue":"INTEM","label":"INTEM","ct":"S1.T3.adult.INTEM","ctratio":"Nakayama_HEPTEM_INTEM_ratio","teach":true,"p":{"CT":230,"CFT":63,"MCF":61},"basis":["threshold ratio 0.8 (Nakayama_HEPTEM_INTEM_ratio): CT 230 s from the 184 s median in S1.T3.adult.INTEM"]},{"hue":"INTEM","claim":"S1.T3.adult.INTEM","dash":true,"label":"HEPTEM","p":{"CT":184,"MCF":61,"CFT":63,"A10":55},"basis":["S1.T3.adult.INTEM"]}],"compare":["CT","MCF"],"marks":["CT","CT2"],"note":"INTEM clotting time at 230 s, where the HEPTEM median of 184 s is 0.8 of it, Nakayama's protamine trigger (Nakayama 2015); HEPTEM at the adult median (Oswald 2010 from Lang 2005)."},{"label":"heparin 0.1 U/ml, in vitro","series":[{"hue":"INTEM","claim":"S27.T2.heparin.INTEM","label":"INTEM, heparin","teach":true,"p":{"CT":351,"MCF":59,"CFT":110,"A10":51.9,"ML":6,"LI30":100},"basis":["S27.T2.heparin.INTEM"]},{"hue":"INTEM","claim":"S27.T2.heparin.HEPTEM","dash":true,"label":"HEPTEM, heparin","p":{"CT":162,"MCF":59,"CFT":69,"A10":54,"ML":13,"LI30":97},"basis":["S27.T2.heparin.HEPTEM"]}],"compare":["CT","CFT","A10","MCF"],"marks":["CT","CT2"],"note":"In vitro model, healthy donors, n = 11 (Larsen 2011, Table 2): heparin 0.1 U/ml. INTEM waits 351 s and HEPTEM 162 s for the same 59 mm of firmness, and EXTEM is unchanged at 69 s. Three of the eleven INTEM clotting times stayed inside the published range, so the comparison with HEPTEM is what catches the heparin, at 5.8 minutes."}]},"n":10},{"id":"platelet-dysfunction","section":1,"title":"Platelet dysfunction, the trace cannot see it","twin":null,"param":null,"row":"aspirin and clopidogrel leave the trace unchanged","entry":"The standard trace counts the platelets' bulk, and a patient on aspirin or clopidogrel can have a normal maximum firmness with platelets that do not work. Only the GPIIb/IIIa blockers show on the standard trace.\n\nPlatelet mapping runs extra cups: one with all platelets active, one with the platelets inhibited and only fibrin left, and one activated by ADP or arachidonic acid, so the platelets still working are the difference. The treatment follows the mapping, not the trace.","analogy":"A register counts who turned up and says nothing about who is working, and the standard trace counts platelets the same way.","sources":["S1","S3","S4","S5","S25","S26","S31"],"related":["Low platelets","Hypothermia and the cold patient"],"figure":{"window":1800,"ymax":80},"intervention":{"give":"Nothing on the strength of the standard trace","when":"TEG and ROTEM are insensitive to aspirin and clopidogrel (Srivastava 2013, Table 3; Curry 2018), so a normal trace does not clear a patient on them. TEG platelet mapping gives the inhibition as a percentage of the maximum amplitude, and the ROTEM platelet module (ARA-TEM, ADP-TEM, TRAP-TEM) measures it by aggregometry (Wells 2022).","also":"Wells 2022 (Table 1) lists platelets and DDAVP against a low MA/MCF from platelet dysfunction; none of the sources read here gives a trigger value for either. Both cardiac algorithms state the blind spot outright (Karkouti 2016; Görlinger 2011). TEG 6s platelet mapping in 80 patients before vascular surgery found resistance in 6 of 20 on aspirin and 14 of 20 on clopidogrel, and in eight patients retested five to seven days after stopping clopidogrel the ADP result had not measurably changed (Shah 2026)."},"knob":{"type":"chips","states":[{"label":"standard trace","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"adult EXTEM median","p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]}],"marks":["CT","MCF"],"note":"The adult EXTEM median (Oswald 2010 from Lang 2005): aspirin and clopidogrel leave this curve where it is (Srivastava 2013, Table 3).","readouts":["CT","MCF"]},{"label":"platelet mapping","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"all platelets (thrombin cup)","p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","dash":true,"label":"ADP cup","ilu":true,"ct":"S1.T3.adult.EXTEM","mcf":38,"teach":true,"p":{"CT":55,"MCF":38,"CFT":95,"A10":53},"basis":["base S1.T3.adult.EXTEM","MCF 38 ILLUSTRATIVE"]},{"hue":"FIBTEM","claim":"S1.T4.adult.FIBTEM","label":"fibrin only","p":{"CT":39,"MCF":16,"kind":"fib"},"basis":["S1.T4.adult.FIBTEM"]}],"compare":["MCF"],"marks":["MCF"],"note":"Inhibition is 100 minus (ADP minus fibrin) over (thrombin minus fibrin), in maximum amplitudes (Wells 2022, Fig 3). The ADP cup is ILLUSTRATIVE at 38 mm, which prints 50% inhibition against 60 and 16 mm."}]},"n":11},{"id":"hypothermia","section":1,"title":"Hypothermia and the cold patient","twin":null,"param":null,"row":"the cup is warmed and the patient is not; warm the patient","entry":"Both instruments warm the sample to 37 °C before the pin moves, so the trace reports the clotting of warm blood and says nothing about the cold patient it came from. Hypothermia slows clotting at the bedside and prolongs the ACT, and the trace stays normal.\n\nThe treatment is warmth, and the paediatric algorithm checks temperature, ionised calcium, pH and haematocrit before it lets the trace choose a product.","analogy":"Testing a car engine in a heated garage says nothing about how it starts on a frosty morning.","sources":["S1","S3","S13","S17"],"related":["Platelet dysfunction, the trace cannot see it","The child on bypass"],"figure":{"window":1800,"ymax":80},"intervention":{"give":"Warmth, calcium and pH before any product","when":"Faraoni's algorithm checks temperature 36 °C or more, ionised calcium 1.03 mmol/L or more, pH 7.35 or more and haematocrit 24% or more before the ROTEM is read (Faraoni 2015, Fig 6).","also":"The measurement is made at 37 °C, so the trace will not reflect hypothermia, and the ACT is prolonged by it (Srivastava 2013). Nakayama's children were cooled to 32 to 34 °C on bypass and the algorithm was run after rewarming and protamine (Nakayama 2015)."},"knob":{"type":"chips","states":[{"label":"the trace","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"adult EXTEM median","p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]}],"marks":["CT","MCF"],"note":"Both cups are held at 37 °C (Srivastava 2013; Oswald 2010 warmed the sampling tubes to 37 °C), so this curve is the same whatever the patient's temperature.","readouts":["CT","MCF"]},{"label":"before the trace","series":[],"diagram":"checks","note":"The four checks Faraoni's algorithm makes before the ROTEM is read, and the heparinase check that comes first (Faraoni 2015, Fig 6; Nakayama 2015)."}]},"n":12},{"id":"anticoagulants","section":1,"title":"Anticoagulants the trace misses or catches","twin":null,"param":null,"row":"warfarin and three DOACs prolong the wait; apixaban does not","entry":"In donor blood, rivaroxaban at 200 ng/mL took the EXTEM clotting time from 53 to 117 s and dabigatran from 62 to 109 s; apixaban needed about 1,000 ng/mL to double it, so a normal trace does not exclude apixaban. Warfarin prolongs the same wait.\n\nThe rest of the curve does not move, the same picture as a factor deficiency, and the trace cannot say which drug. The treatment is the history and a drug level, not a product.","analogy":"A metal detector finds the coins it is tuned for and misses the rest, and the trace is tuned for some anticoagulants and not for apixaban.","sources":["S1","S4","S5","S20"],"related":["Factor deficiency, the long clotting time","Heparin"],"figure":{"window":900,"ymax":80},"intervention":{"give":"The history and a drug level, not a product","when":"In blood from 20 healthy donors, five per drug, the plasma level that doubled the EXTEM clotting time was 176 ng/mL for rivaroxaban, 284 for dabigatran, 134 for edoxaban and 1,042 for apixaban; the EXTEM CT was above range in every donor at 200 ng/mL of rivaroxaban or dabigatran and 100 of edoxaban, and in none to three of five at 50 ng/mL of any drug (Seyve 2018). Warfarin and heparin prolong the clotting time (Curry 2018).","also":"Firmness, clot formation time, alpha and FIBTEM did not move with any of the four drugs (Seyve 2018). The DOAC changes are non-specific and do not say which drug; ecarin (ECATEM) and low tissue factor (TFTEM) assays are under evaluation (Wells 2022). Reversal agents are outside the sources read here."},"knob":{"type":"chips","states":[{"label":"rivaroxaban 200","series":[{"hue":"EXTEM","claim":"S20.T2.rivaroxaban0.EXTEM","label":"the donors' own blood","faint":true,"p":{"CT":53,"MCF":57,"CFT":134},"basis":["S20.T2.rivaroxaban0.EXTEM"]},{"hue":"EXTEM","claim":"S20.T2.rivaroxaban200.EXTEM","label":"rivaroxaban 200 ng/mL","teach":true,"p":{"CT":117,"MCF":59.8,"CFT":109},"basis":["S20.T2.rivaroxaban200.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT","MCF"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.EXTEM","label":"adult CT range"}],"note":"Blood from five healthy donors, EXTEM before and after rivaroxaban at 200 ng/mL (Seyve 2018, Table 2): the clotting time doubles and the clot formation time and firmness stay where they were. The bracket is the adult range (Lang 2005 via Oswald 2010)."},{"label":"dabigatran 200","series":[{"hue":"EXTEM","claim":"S20.T2.dabigatran0.EXTEM","label":"the donors' own blood","faint":true,"p":{"CT":62,"MCF":54,"CFT":171},"basis":["S20.T2.dabigatran0.EXTEM"]},{"hue":"EXTEM","claim":"S20.T2.dabigatran200.EXTEM","label":"dabigatran 200 ng/mL","teach":true,"p":{"CT":109,"MCF":54,"CFT":151},"basis":["S20.T2.dabigatran200.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT","MCF"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.EXTEM","label":"adult CT range"}],"note":"Five donors, EXTEM before and after dabigatran at 200 ng/mL (Seyve 2018, Table 2): 62 to 109 s, the rest of the curve unmoved."},{"label":"edoxaban 100","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"adult median","faint":true,"p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","claim":"S20.T2.edoxaban100.EXTEM","label":"edoxaban 100 ng/mL","teach":true,"p":{"CT":105,"MCF":64,"CFT":101},"basis":["S20.T2.edoxaban100.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT","MCF"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.EXTEM","label":"adult CT range"}],"note":"Five donors, EXTEM at 100 ng/mL of edoxaban, clotting time 105 s from the donors' own 54 s (Seyve 2018, Table 2), beside the adult median (Lang 2005 via Oswald 2010)."},{"label":"apixaban 1,000","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"adult median","faint":true,"p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","claim":"S20.T2.apixaban1000.EXTEM","label":"apixaban 1,000 ng/mL","teach":true,"p":{"CT":106,"MCF":58.4,"CFT":112},"basis":["S20.T2.apixaban1000.EXTEM"]}],"compare":["CT","CFT","MCF"],"marks":["CT","MCF"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.EXTEM","label":"adult CT range"}],"note":"Five donors, EXTEM at 1,000 ng/mL of apixaban, several times a therapeutic level: the clotting time reaches 106 s from the donors' own 55 s (Seyve 2018, Table 2). At therapeutic levels the trace is normal and the drug is still there."}]},"n":13},{"id":"bypass","section":1,"title":"The child on bypass","twin":null,"param":null,"row":"three triggers on one trace, each with its product","entry":"After bypass a child's trace shows dilution: a longer clotting time, a slower climb and a lower maximum, with FIBTEM thinned too. In 150 children the triggers that predicted bleeding were EXTEM CT 111 s or more, EXTEM A10 38 mm or less and FIBTEM A10 3 mm or less.\n\nA randomised trial of 100 children used EXTEM A10 30 mm and FIBTEM A10 5 mm, and cut 12 hour chest drainage from 16 to 9 ml/kg.","analogy":"The three cut-offs work like warning lights on a dashboard, each set at the level below which trouble followed in the children studied.","sources":["S1","S5","S13","S17","S24","S25","S26"],"related":["Normal for whom","Heparin","Factor deficiency, the long clotting time"],"figure":{"window":900,"ymax":80},"intervention":{"give":"Plasma, fibrinogen or platelets, each on its own trigger","when":"EXTEM CT 111 s or more: FFP 15 ml/kg. FIBTEM A10 3 mm or less: fibrinogen concentrate 25 mg/kg. EXTEM A10 38 mm or less with FIBTEM A10 above 3 mm: platelets, one unit per 5 kg. These are one centre's doses in a retrospective series of 150 children, never tested prospectively (Faraoni 2015; algorithm sensitivity 0.91, specificity 0.65). The randomised evidence is Nakayama 2015: EXTEM A10 30 mm for platelets 10 ml/kg and FIBTEM A10 5 mm for FFP 20 ml/kg, fibrinogen concentrate being unavailable, in 100 children at one centre; red cell transfusion at 12 hours fell from 23 to 11 ml/kg.","adults":"Adults, the multicentre trial: after protamine, an ACT within 10% of baseline and 60 g of sponge weight in five minutes, FIBTEM A10 8 mm or less gives cryoprecipitate 10 units or fibrinogen 4 g, EXTEM CT over 90 s gives PCC about 20 IU/kg or plasma 2 to 4 units, and platelets follow a functioning count under 75 or EXTEM A10 under 35 with FIBTEM above 8; red cells fell by 9% and platelets by 23% (Karkouti 2016, 12 hospitals, 7,402 patients). Frankfurt's single-centre trial of 100 bleeding patients used EXTEM CT 80 s, EXTEM A10 40 mm and FIBTEM A10 10 mm, and cut red cells from 5 to 3 units (Weber 2012). Essen's before-and-after cohort of 3,865 used the same shape at EXTEM CT 90 s, with FFP use falling from 19% to 1% and in-hospital mortality unchanged (Görlinger 2011).","also":"Both paediatric algorithms give protamine first when the heparinase ratio is below 0.8, and Faraoni's runs only in children with a bleeding probability of 0.2 or more (Faraoni 2015, Fig 6; Nakayama 2015, Fig 1)."},"knob":{"type":"chips","states":[{"label":"healthy, 2-5 y","series":[{"hue":"EXTEM","claim":"S1.T3.y2-5.EXTEM","label":"EXTEM","p":{"CT":56,"MCF":61,"CFT":72,"A10":58},"basis":["S1.T3.y2-5.EXTEM"]},{"hue":"FIBTEM","claim":"S1.T4.y2-5.FIBTEM","label":"FIBTEM","p":{"CT":39,"MCF":13,"kind":"fib"},"basis":["S1.T4.y2-5.FIBTEM"]}],"trig":{"ct":111,"a10":38,"fib":3},"marks":["CT","A10","trig"],"note":"Medians for 2 to 5 years (Oswald 2010); the three trigger lines are Faraoni's (Faraoni 2015).","readouts":["CT","A10","FIBA10"]},{"label":"at Faraoni's triggers","series":[{"hue":"EXTEM","label":"EXTEM","extA10":38,"ctval":111,"ilu":true,"p":{"CT":111,"CFT":150,"MCF":41.4},"basis":["threshold EXTEM A10 38 mm; CT 111 s; CFT ILLUSTRATIVE"]},{"hue":"FIBTEM","label":"FIBTEM","fibA10":3,"p":{"kind":"fib","CT":39,"MCF":3.3},"basis":["threshold FIBTEM A10 3 mm; shape S2.T2.T1.FIBTEM"]}],"trig":{"ct":111,"a10":38,"fib":3},"marks":["CT","A10","trig"],"note":"EXTEM CT 111 s and A10 38 mm, FIBTEM A10 3 mm, the ROC cut-offs (Faraoni 2015). The EXTEM climb between them is ILLUSTRATIVE.","readouts":["CT","A10","FIBA10"]},{"label":"at Nakayama's triggers","series":[{"hue":"EXTEM","label":"EXTEM","extA10":30,"ct":"S1.T3.y2-5.EXTEM","p":{"CT":56,"CFT":72,"MCF":30},"basis":["threshold EXTEM A10 30 mm; CT and CFT from S1.T3.y2-5.EXTEM"]},{"hue":"FIBTEM","label":"FIBTEM","fibA10":5,"p":{"kind":"fib","CT":39,"MCF":5.6},"basis":["threshold FIBTEM A10 5 mm; shape S2.T2.T1.FIBTEM"]}],"trig":{"a10":30,"fib":5},"marks":["CT","A10","trig"],"note":"EXTEM A10 30 mm and FIBTEM A10 5 mm, the cut-offs of the randomised trial (Nakayama 2015), with the clotting time and climb at the 2 to 5 year median (Oswald 2010).","readouts":["CT","A10","FIBA10"]},{"label":"before and after bypass","series":[{"hue":"EXTEM","claim":"S17.T2.pre.EXTEM","label":"before bypass","faint":true,"p":{"CT":55,"MCF":59.4,"CFT":102,"A10":51.8},"basis":["S17.T2.pre.EXTEM"]},{"hue":"EXTEM","claim":"S17.T2.post.EXTEM","label":"after bypass","teach":true,"p":{"CT":151,"MCF":34.5,"CFT":387,"A10":25.2,"fit":"amplitude"},"basis":["S17.T2.post.EXTEM"]}],"compare":["CT","CFT","A10","MCF"],"marks":["CT","A10","MCF"],"note":"A published pair from one cohort of 78 children: EXTEM after induction, CT 55 s, A10 52, MCF 59 mm, and after bypass before protamine, CT 151 s, A10 25, MCF 35 mm (Nakayama 2015, Table 2). The after-bypass curve is drawn through its CT, A10 and MCF, so its clot formation time comes out at 387 s where the table's median is 407 s."},{"label":"FIBTEM, before and after","series":[{"hue":"FIBTEM","claim":"S17.T2.pre.FIBTEM","label":"before bypass","faint":true,"p":{"CT":39,"MCF":11.6,"kind":"fib"},"basis":["S17.T2.pre.FIBTEM"]},{"hue":"FIBTEM","claim":"S17.T2.post.FIBTEM","label":"after bypass","teach":true,"p":{"CT":39,"MCF":4.2,"kind":"fib"},"basis":["S17.T2.post.FIBTEM"]}],"ymax":20,"compare":["A10","MCF"],"marks":["A10","MCF"],"note":"The same cohort's FIBTEM: A10 10.6 and MCF 11.6 mm after induction, A10 3.6 and MCF 4.2 mm after bypass, means (Nakayama 2015, Table 2). After bypass the fibrin clot has almost gone."},{"label":"adults, EXTEM","series":[{"hue":"EXTEM","claim":"S17.T2.post.EXTEM","label":"child after bypass","faint":true,"p":{"CT":151,"MCF":34.5,"CFT":387,"A10":25.2,"fit":"amplitude"},"basis":["S17.T2.post.EXTEM"]},{"hue":"EXTEM","claim":"S24.T3.enrol.EXTEM","label":"adults bleeding after bypass","short":"bleeding","teach":true,"p":{"CT":97,"points":true,"A10":42,"CTpub":true},"basis":["S24.T3.enrol.EXTEM"]},{"hue":"EXTEM","claim":"S24.T3.after.EXTEM","label":"the same adults, treated","hollow":true,"short":"treated","p":{"CT":74,"points":true,"A10":48,"CTpub":true},"basis":["S24.T3.after.EXTEM"]}],"compare":["CT","A10"],"marks":["pts"],"note":"The only adult coagulopathic pair in the sources: 50 adults bleeding after cardiac surgery, EXTEM CT 97 s and A10 42 mm at enrolment, then CT 74 s and A10 48 mm once treatment had stopped the bleeding, medians (Weber 2012, Table 3). No firmness or clot formation time was published, so they print as points and the child's curve after bypass gives the shape (Nakayama 2015)."},{"label":"adults, FIBTEM","series":[{"hue":"FIBTEM","claim":"S17.T2.post.FIBTEM","label":"child after bypass","faint":true,"p":{"CT":39,"MCF":4.2,"kind":"fib"},"basis":["S17.T2.post.FIBTEM"]},{"hue":"FIBTEM","claim":"S24.T3.enrol.FIBTEM","label":"adults bleeding after bypass","short":"bleeding","teach":true,"p":{"CT":39,"points":true,"A10":6,"CTpub":false,"kind":"fib"},"basis":["S24.T3.enrol.FIBTEM"]},{"hue":"FIBTEM","claim":"S24.T3.after.FIBTEM","label":"the same adults, treated","hollow":true,"short":"treated","p":{"CT":39,"points":true,"A10":10,"CTpub":false,"kind":"fib"},"basis":["S24.T3.after.FIBTEM"]}],"ymax":20,"compare":["A10"],"marks":["pts"],"note":"The same 50 adults' FIBTEM A10: 6 mm at enrolment and 10 mm after treatment, medians (Weber 2012, Table 3), as points on the child's FIBTEM after bypass (Nakayama 2015). No FIBTEM clotting time was published; the points sit at 10 minutes after the labour median of 39 s (de Lange 2014)."}]},"n":14},{"id":"obstetric","section":1,"title":"The obstetric threshold","twin":null,"param":null,"row":"FIBTEM A5 at 19, 15, 13, 12 and 7 mm, with the grade","entry":"The FIBTEM A5 carries the obstetric decision and is ready ten minutes after the sample is taken, against an hour for a laboratory fibrinogen. Above 12 mm, fibrinogen replacement is unlikely to improve haemostasis, graded 2B; below 7 mm, or below 12 mm with ongoing bleeding, it may help, graded 2C.\n\nOBS2 randomised women at 15 mm or less to fibrinogen concentrate or placebo and found no reduction in transfusion, and NICE does not recommend the assays in obstetric bleeding.","analogy":"A fuel gauge's reserve line tells the driver when filling up is worth the stop, and the guideline draws that line at 12 mm.","sources":["S2","S4","S5","S9","S14","S16","S19","S33"],"related":["Low fibrinogen","Normal for whom","Where the evidence stands"],"figure":{"window":900,"ymax":40},"intervention":{"give":"Fibrinogen concentrate or cryoprecipitate","when":"FIBTEM A5 under 7 mm, or under 12 mm with ongoing bleeding (Curry 2018 BSH, grade 2C); above 12 mm unlikely to help (grade 2B). In OBS2, 55 women randomised at 15 mm or less: incidence rate ratio for allogeneic units 0.72 (0.30 to 1.70), P 0.45 (Collins 2017 OBS2).","adults":"Liverpool's algorithm, run with the first four units of red cells: EXTEM CT over 100 s with active bleeding, FFP; FIBTEM A5 under 7 mm with EXTEM A5 under 47, fibrinogen concentrate 3 g and a repeat trace in 10 minutes; 7 to 12 mm, 3 g only if still bleeding; above 12 mm, no products; a low EXTEM with a normal FIBTEM, platelets. Blood components per woman fell from 8 to 3 and six or more units from 29% to 10%, before and after, 42 then 51 women; the paper reads an A5 under 12 mm as about 2 g/L and under 7 as 1.5 to 2 g/L (Mallaiah 2015).","also":"Women who went on to four or more units of red cells had a median A5 of 13 mm (10 to 17) and those who did not 19 mm (17 to 23); under 10 mm the bleeds lasted 127 minutes against 65 (Collins 2014, 356 women). Tranexamic acid is not withheld on the trace (Curry 2018, grade 1B). Coagulopathy is uncommon early in postpartum haemorrhage: at a litre of blood loss 97% of women have a normal PT and aPTT, which stay normal to 3 or 4 litres; fibrinogen under 2 g/L is found in 2.4% at a litre and 17% above 2.5 litres, and platelets under 75 in 5% above 2.5 litres. About half of the coagulopathy that does occur is acute obstetric coagulopathy, plasmin-driven, arriving with abruption or amniotic fluid embolism before blood loss explains it, in which fibrinogen given may do less than expected and the trace is repeated after it (Riddell 2026, a narrative review from the OBS group citing their own cohorts). Two trials of fibrinogen given without a low reading, FIB-PPH and FIDEL, found no benefit in 686 women of whom ten had a fibrinogen under 2 g/L; OBS UK, a stepped-wedge trial of assay-guided replacement in 200,000 women, reports in early 2027 (Riddell 2026)."},"knob":{"type":"chips","states":[{"label":"19 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"labour median","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"FIBTEM","fibA5":19,"teach":true,"p":{"kind":"fib","CT":39,"MCF":23.4},"basis":["threshold FIBTEM A5 19 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","thr"],"note":"Median A5 in women whose bleeding did not progress to four units of red cells (Collins 2014, Table 2), beside the labour median (de Lange 2014)."},{"label":"15 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"labour median","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"FIBTEM","fibA5":15,"teach":true,"p":{"kind":"fib","CT":39,"MCF":18.4},"basis":["threshold FIBTEM A5 15 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","thr"],"note":"The OBS2 entry trigger: 55 women randomised at 15 mm or less, no reduction in transfusion (Collins 2017 OBS2)."},{"label":"13 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"labour median","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"FIBTEM","fibA5":13,"teach":true,"p":{"kind":"fib","CT":39,"MCF":16},"basis":["threshold FIBTEM A5 13 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","thr"],"note":"Median A5 in women who progressed to four or more units of red cells (Collins 2014, Table 2)."},{"label":"12 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"labour median","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"FIBTEM","fibA5":12,"teach":true,"p":{"kind":"fib","CT":39,"MCF":14.7},"basis":["threshold FIBTEM A5 12 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","thr"],"note":"Above 12 mm fibrinogen replacement is unlikely to help, grade 2B (Curry 2018 BSH); the OBS2 subgroup at 12 mm or less did not reach significance (Collins 2017 OBS2)."},{"label":"7 mm","series":[{"hue":"FIBTEM","claim":"S2.T2.T1.FIBTEM","label":"labour median","faint":true,"p":{"CT":39,"MCF":25,"kind":"fib","ML":0},"basis":["S2.T2.T1.FIBTEM"]},{"hue":"FIBTEM","label":"FIBTEM","fibA5":7,"teach":true,"p":{"kind":"fib","CT":39,"MCF":8.6},"basis":["threshold FIBTEM A5 7 mm; shape S2.T2.T1.FIBTEM"]}],"compare":["A5","A10","MCF"],"marks":["A5","thr"],"note":"Below 7 mm, or below 12 with ongoing bleeding, replacement may help, grade 2C (Curry 2018 BSH, Wells 2022)."}]},"n":15},{"id":"normal-bleeding","section":1,"title":"Normal trace, bleeding patient","twin":null,"param":null,"row":"no product; look for the surgical cause","entry":"A normal trace in a bleeding patient is the most useful result the machine can give. In liver transplantation a normal trace has a 95% negative predictive value for transfusion, and the trauma recommendation gives the same message at grade 2B: coagulopathy is unlikely, blood components are unlikely to help, and the team should look for a surgical cause.\n\nAn abnormal trace predicts bleeding poorly, and a change between two serial traces predicts it better than either trace alone.","analogy":"A car that passes its electrical checks but will not start has a mechanical fault, and a patient who bleeds with a normal trace has a surgical one.","sources":["S1","S3","S5","S10","S21","S23"],"related":["Where the evidence stands","Hyperfibrinolysis"],"figure":{"window":1800,"ymax":80},"intervention":{"give":"No blood component on the strength of the trace","when":"A normal trace carries a 95% negative predictive value for transfusion in liver transplantation (Curry 2018 BSH, grade 1C) and a high negative predictive value in trauma (grade 2B); after cardiac surgery a patient who is not bleeding receives no empirical components whatever the trace shows (grade 2A).","also":"A change of more than 15% between serial tests is the warning after cardiac surgery (Curry 2018, ungraded). In trauma the ITACTIC trial found no difference in outcome between assay-guided and laboratory-guided protocols (ITACTIC 2021, 396 patients), so a normal trace rules out a coagulopathy to treat more reliably than an abnormal one calls for a product."},"knob":{"type":"chips","states":[{"label":"liver transplant","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"EXTEM","p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]}],"a5thr":{"value":19,"label":"A5 19 mm, platelets under 50"},"marks":["CT","MCF","A5"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.EXTEM","label":"CT range"},{"axis":"a","param":"MCF","claim":"S1.T3.adult.EXTEM","label":"MCF range"}],"note":"A normal trace carries a 95% negative predictive value for transfusion, grade 1C (Curry 2018 BSH); an EXTEM A5 under 19 mm predicts platelets under 50 (Song 2014)."},{"label":"trauma","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"EXTEM","p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]}],"a5thr":{"value":35,"label":"A5 35 mm cut"},"marks":["CT","MCF","A5"],"brackets":[{"axis":"t","param":"CT","claim":"S1.T3.adult.EXTEM","label":"CT range"},{"axis":"a","param":"MCF","claim":"S1.T3.adult.EXTEM","label":"MCF range"}],"note":"Normal results confer a high negative predictive value for transfusion need, grade 2B; an EXTEM A5 of 35 mm is the cut the guideline quotes (Curry 2018 BSH). In 808 trauma patients an A5 of 37 mm or less detected coagulopathy and 40 mm or less predicted massive transfusion, with sensitivities of 66% and 73% (Hagemo 2015)."},{"label":"cardiac","series":[{"hue":"EXTEM","claim":"S1.T3.adult.EXTEM","label":"first test","p":{"CT":55,"MCF":60,"CFT":95,"A10":53},"basis":["S1.T3.adult.EXTEM"]},{"hue":"EXTEM","dash":true,"label":"second test, 15% lower","ilu":true,"ct":"S1.T3.adult.EXTEM","mcf":51,"p":{"CT":55,"MCF":51,"CFT":95,"A10":53},"basis":["base S1.T3.adult.EXTEM","MCF 51 ILLUSTRATIVE"]}],"marks":["CT","MCF"],"brackets":[{"axis":"a","param":"MCF","claim":"S1.T3.adult.EXTEM","label":"MCF range"}],"note":"No empirical components for a patient who is not bleeding, grade 2A; a change of more than 15% between tests is the warning (Curry 2018 BSH). The second trace is ILLUSTRATIVE."}]},"n":16},{"id":"evidence","section":2,"title":"Where the evidence stands","twin":null,"param":null,"row":"NICE, the BSH grades, ESAIC and Cochrane","entry":"NICE recommends the assays in cardiac surgery and does not recommend them for obstetric or trauma bleeding. The BSH guideline grades its cardiac advice 2B, its obstetric and trauma advice 2B and 2C, its liver transplant advice 1C.\n\nThe trials agree: fewer transfusions in cardiac surgery, no difference in the largest trauma trial or the one obstetric trial. The 2025 pooled mortality signal, RR 0.76, does not hold in the four trials with a low risk of bias.","analogy":"A weather forecast is graded by how often it was right in each town, and these grades are the town-by-town record.","sources":["S4","S5","S7","S9","S14","S17","S22","S23","S24","S25","S29","S30","S32","S33"],"related":["The obstetric threshold","Normal trace, bleeding patient"],"figure":{"window":0,"ymax":0},"knob":{"type":"chips","states":[{"label":"guidelines","series":[],"diagram":"evidence","note":"Guideline positions by setting, with NICE as summarised in the BSH guideline (Curry 2018) and ESAIC from one recommendation (Kietaibl 2023); the three pooled analyses read in full. The Cochrane review's 2025 revision pools 35 trials, mostly cardiac surgery: deaths RR 0.76 (0.63 to 0.92) across 19 trials, RR 0.90 (0.72 to 1.12) in the four trials with a low risk of bias, red cells unchanged at RR 0.94, plasma, platelets and re-operations reduced, every outcome graded very low certainty (Kvisselgaard 2025); it replaces the 2017 result of RR 0.52 in eight trials (Wikkelsø 2017). The elective-surgery analysis found no mortality effect, and its red cell effect sits in the ROTEM trials, its platelet effect in the TEG trials (Dias 2025)."},{"label":"trials","series":[],"diagram":"trials","note":"Randomised trials of assay-guided treatment against laboratory-guided or fixed-ratio treatment: the primary result of each, all six read in full. Frankfurt's trial was stopped at its planned interim analysis and was not powered for mortality (Weber 2012). The obstetric answer is due in early 2027 from OBS UK, a stepped-wedge cluster trial of assay-guided fibrinogen replacement across 200,000 births (Riddell 2026)."}]},"n":17}],"sources":[{"key":"S1","name":"Oswald 2010","cite":"Oswald E, Stalzer B, Heitz E, Weiss M, Schmugge M, Strasak A, Innerhofer P, Haas T. Thromboelastometry (ROTEM) in children: age-related reference ranges and correlations with standard coagulation tests. Br J Anaesth 2010;105(6):827-835.","status":"Read in full","link":"https://doi.org/10.1093/bja/aeq258","linkname":"Open the paper (DOI)","via":"","note":""},{"key":"S2","name":"de Lange 2014","cite":"de Lange NM, van Rheenen-Flach LE, Lancé MD, et al. Peri-partum reference ranges for ROTEM thromboelastometry. Br J Anaesth 2014;112(5):852-859.","status":"Read in full","link":"https://doi.org/10.1093/bja/aet480","linkname":"Open the paper (DOI)","via":"","note":""},{"key":"S3","name":"Srivastava 2013","cite":"Srivastava A, Kelleher A. Point-of-care coagulation testing. Contin Educ Anaesth Crit Care Pain 2013;13(1):12-16.","status":"Read in full","link":"https://doi.org/10.1093/bjaceaccp/mks049","linkname":"Open the paper (DOI, free to read)","via":"","note":""},{"key":"S4","name":"Wells 2022","cite":"Wells M, Raja M, Rahman S. Point-of-care viscoelastic testing. BJA Educ 2022;22(1 {"key":"S16","name":"Collins 2014","cite":"Collins PW, Lilley G, Bruynseels D, et al. Fibrin-based clot formation as an early and rapid biomarker for progression of postpartum hemorrhage: a prospective study. Blood 2014;124(11):1727-1736.","status":"Read in full","link":"https://doi.org/10.1182/blood-2014-04-567891","linkname":"Open the paper (DOI)","via":"","note":""},{"key":"S17","name":"Nakayama 2015","cite":"Nakayama Y, Nakajima Y, Tanaka KA, Sessler DI, Maeda S, Iida J, Ogawa S, Mizobe T. Thromboelastometry-guided intraoperative haemostatic management reduces bleeding and red cell transfusion after paediatric cardiac surgery. Br J Anaesth 2015;114(1):91-102.","status":"Read in full","link":"https://doi.org/10.1093/bja/aeu339","linkname":"Open the paper (DOI)","via":"","note":""},{"key":"S18","name":"Kirchner 2014","cite":"Kirchner C, Dirkmann D, Treckmann JW, Paul A, Hartmann M, Saner FH, Görlinger K. Coagulation management with factor concentrates in liver transplantation: a single-center experience. Transfusion 2014;54(10 Pt 2):2760-2768.","status":"Not read, cited through Curry 2018","link":"https://doi.org/10.1111/trf.12707","linkname":"Open the paper (DOI, free to read)","via":"Curry 2018 BSH","note":""},{"key":"S19","name":"Mallaiah 2015","cite":"Mallaiah S, Barclay P, Harrod I, Chevannes C, Bhalla A. Introduction of an algorithm for ROTEM-guided fibrinogen concentrate administration in major obstetric haemorrhage. Anaesthesia 2015;70(2):166-175.","status":"Read in full","link":"https://doi.org/10.1111/anae.12859","linkname":"Open the paper (DOI)","via":"","note":""},{"key":"S21","name":"Hagemo 2015","cite":"Hagemo JS, Christiaans SC, Stanworth SJ, et al. Detection of acute traumatic coagulopathy and massive transfusion requirements by means of rotational thromboelastometry: an international prospective validation study. Crit Care 2015;19:97.","status":"Abstract read","link":"https://doi.org/10.1186/s13054-015-0823-y","linkname":"Open the paper (DOI, free
